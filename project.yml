name: TheNotchApp
options:
  bundleIdPrefix: com.hassan.notchy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  TheNotchApp:
    type: application
    platform: macOS
    sources:
      - path: TheNotchApp
    resources:
      - path: TheNotchApp/Resources/Assets.xcassets
    info:
      path: TheNotchApp/Resources/Info.plist
      properties:
        CFBundleName: The Notch App
        CFBundleDisplayName: The Notch App
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSCalendarsUsageDescription: "The Notch App shows today's calendar events in the notch panel."
        NSCalendarsFullAccessUsageDescription: "The Notch App shows today's calendar events in the notch panel."
        NSAppleEventsUsageDescription: "The Notch App controls Spotify, Music, and Chrome playback from the notch panel."
        NSHumanReadableCopyright: "The Notch App"
    entitlements:
      path: TheNotchApp/Resources/TheNotchApp.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.app-sandbox: false
        com.apple.security.temporary-exception.apple-events:
          - com.spotify.client
          - com.apple.Music
          - com.google.Chrome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hassan.notchy.app
        PRODUCT_NAME: The Notch App
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
