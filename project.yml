name: Notchy
options:
  bundleIdPrefix: com.hassan.notchy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Notchy:
    type: application
    platform: macOS
    sources:
      - path: Notchy
    resources:
      - path: Notchy/Resources/Assets.xcassets
    info:
      path: Notchy/Resources/Info.plist
      properties:
        CFBundleName: Notchy
        CFBundleDisplayName: Notchy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSCalendarsUsageDescription: "Notchy shows today's calendar events in the notch panel."
        NSCalendarsFullAccessUsageDescription: "Notchy shows today's calendar events in the notch panel."
        NSAppleEventsUsageDescription: "Notchy controls Spotify, Music, and Chrome playback from the notch panel."
        NSHumanReadableCopyright: "Notchy"
    entitlements:
      path: Notchy/Resources/Notchy.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.app-sandbox: false
        com.apple.security.temporary-exception.apple-events:
          - com.spotify.client
          - com.apple.Music
          - com.google.Chrome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hassan.notchy.app
        PRODUCT_NAME: Notchy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
